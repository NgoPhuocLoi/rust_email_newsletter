[package]
name = "rust_email_newsletter"
version = "0.1.0"
edition = "2024"
authors = ["Loi Ngo <ngophuocloi2511@gmail.com>"]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "rust_email_newsletter"

[dependencies]
config = "0.15.22"
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4.44"
log = "0.4.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
tracing-bunyan-formatter = "0.3"

# Using table-like toml syntax to avoid a super-long line!
[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
]
